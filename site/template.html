<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Great Data Analysis</title>
<meta name="description" content="The habits of careful data analysts, re-versioned for the agentic era.">
<meta name="author" content="Tomás Ravalli">
<link rel="canonical" href="https://0trm.dev/great-data-analysis/">
<meta property="og:type" content="article">
<meta property="og:site_name" content="0trm.dev">
<meta property="og:url" content="https://0trm.dev/great-data-analysis/">
<meta property="og:title" content="Great Data Analysis">
<meta property="og:description" content="The habits of careful data analysts, re-versioned for the agentic era.">
<!-- The 🔍 from the repo description, from Noto Emoji (Apache 2.0) -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  /* Before paint, so a remembered dark theme never flashes light first */
  (function () {
    try {
      var t = localStorage.getItem("0trm-theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
<style>
:root {
  --bg: #fcfcfa;
  --text: #1a1a1a;
  --muted: #5a5a5a;
  --link: #0645ad;
  --visited: #5a3696;
  --bar: #ebebe5;
  --rule: #c4c4bc;
  --code: #f3f3ee;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #282c34;
    --text: #d7dae0;
    --muted: #9da5b4;
    --link: #61afef;
    --visited: #c678dd;
    --bar: #353b45;
    --rule: #3e4451;
    --code: #21252b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #282c34;
  --text: #d7dae0;
  --muted: #9da5b4;
  --link: #61afef;
  --visited: #c678dd;
  --bar: #353b45;
  --rule: #3e4451;
  --code: #21252b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 16px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 Verdana, Geneva, Tahoma, sans-serif;
  overflow-wrap: break-word;
}
a { color: var(--link); }
a:visited { color: var(--visited); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }

.layout { padding: 8px 20px 28px; }

/* Contents: every habit, numbered, with the one in view marked */
.navtop { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
/* Theme: one button showing the theme a click switches to */
.toggle button { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; padding: 0; background: none; border: 0; color: var(--muted); cursor: pointer; }
.toggle button:hover { color: var(--text); }
.toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.toggle .to-light { display: none; }
:root[data-theme="dark"] .toggle .to-dark { display: none; }
:root[data-theme="dark"] .toggle .to-light { display: inline-flex; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .toggle .to-dark { display: none; }
  :root:not([data-theme="light"]) .toggle .to-light { display: inline-flex; }
}
.toc summary { cursor: pointer; font-size: 12px; color: var(--muted); padding: 6px 0 0; }
.toc ol { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; line-height: 1.35; }
.toc li a { display: block; padding: 3px 6px; color: var(--text); text-decoration: none; border-left: 2px solid transparent; }
.toc li a:hover { text-decoration: underline; }
.toc li.l2 a { font-weight: bold; margin-top: 8px; background: var(--bar); }
.toc li.l3 a { color: var(--muted); }
.toc li a.on { color: var(--text); border-left-color: var(--link); background: var(--code); }
.toc .no { display: inline-block; min-width: 2.2em; color: var(--muted); font-weight: normal; }

main { max-width: 44em; }
h1 { font-size: 24px; line-height: 1.15; margin: 14px 0 4px; }
h1 + p { color: var(--muted); margin-top: 0; }
h2 { font-size: 17px; margin: 36px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--text); }
h3 { font-size: 14px; margin: 24px 0 4px; }
.no { color: var(--muted); font-weight: normal; margin-right: .2em; }
p, ul, ol { margin: 0 0 11px; }
pre { background: var(--code); padding: 10px 12px; margin: 12px 0 16px; font: 12.5px/1.2 Menlo, "SF Mono", Consolas, "DejaVu Sans Mono", monospace; overflow-x: auto; }
pre code { font: inherit; }
code { font-family: Menlo, "SF Mono", Consolas, "DejaVu Sans Mono", monospace; font-size: .9em; }
footer { font-size: 11px; color: var(--muted); border-top: 1px solid var(--rule); margin-top: 28px; padding-top: 8px; }
footer p { margin: 0; }

@media (min-width: 1024px) {
  .layout { display: grid; grid-template-columns: 290px minmax(0, 44em); column-gap: 56px; }
  .toc { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; padding: 8px 0 20px; }
  .toc summary { display: none; }
}
@media (max-width: 1023px) {
  .layout { padding: 4px 16px 24px; }
  .toc { margin-bottom: 8px; }
  pre { font-size: 11px; margin-left: -16px; margin-right: -16px; }
}
</style>
</head>
<body>
<div class="layout">
<nav class="toc" aria-label="Contents">
  <div class="navtop">
    <a target="_blank" rel="noopener" href="https://0trm.dev/">0trm.dev</a>
    <span class="toggle">
      <button type="button" class="to-dark" aria-label="Switch to dark theme"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.6A6.8 6.8 0 0 1 7.4 4a6.8 6.8 0 1 0 8.6 8.6z"/></svg></button>
      <button type="button" class="to-light" aria-label="Switch to light theme"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.5v2.5M10 16v2.5M1.5 10H4M16 10h2.5M4 4l1.8 1.8M14.2 14.2 16 16M4 16l1.8-1.8M14.2 5.8 16 4"/></svg></button>
    </span>
  </div>
  <details open>
    <summary>Contents</summary>
    <ol>
{{toc}}
    </ol>
  </details>
</nav>
<div>
<main>
{{content}}
</main>
<footer><p>Tomás Ravalli · adapted from Patrick Riley's <i>Good Data Analysis</i> (2019) · <a target="_blank" rel="noopener" href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · <a target="_blank" rel="noopener" href="https://github.com/0trm/great-data-analysis">source</a></p></footer>
</div>
</div>
<script>
(function () {
  // Theme: the system's until the button is pressed; the choice is shared with the rest of 0trm.dev
  var root = document.documentElement, mq = matchMedia("(prefers-color-scheme: dark)");
  document.querySelectorAll(".toggle button").forEach(function (b) {
    b.addEventListener("click", function () {
      var next = (root.dataset.theme || (mq.matches ? "dark" : "light")) === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("0trm-theme", next); } catch (e) {}
    });
  });

  // Contents: folded on phones, closed again after a pick there
  var toc = document.querySelector(".toc"), details = toc.querySelector("details");
  var narrow = matchMedia("(max-width: 1023px)");
  if (narrow.matches) details.removeAttribute("open");
  toc.querySelectorAll('a[href^="#"]').forEach(function (a) {
    a.addEventListener("click", function () { if (narrow.matches) details.removeAttribute("open"); });
  });

  // Mark the last heading above the top fifth of the screen, and keep it visible in the contents
  var links = {};
  toc.querySelectorAll('a[href^="#"]').forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
  var heads = Array.prototype.filter.call(document.querySelectorAll("main h2[id], main h3[id]"), function (h) { return links[h.id]; });
  var marked = null, queued = false;
  function mark() {
    queued = false;
    var line = innerHeight / 5, current = null;
    heads.forEach(function (h) { if (h.getBoundingClientRect().top <= line) current = h; });
    var a = current && links[current.id];
    if (a === marked) return;
    if (marked) marked.classList.remove("on");
    marked = a;
    if (!a) return;
    a.classList.add("on");
    if (!narrow.matches) {
      var r = a.getBoundingClientRect(), box = toc.getBoundingClientRect();
      if (r.top < box.top || r.bottom > box.bottom) toc.scrollTop += r.top - box.top - box.height / 3;
    }
  }
  addEventListener("scroll", function () { if (!queued) { queued = true; requestAnimationFrame(mark); } }, { passive: true });
  mark();
})();
</script>
</body>
</html>
